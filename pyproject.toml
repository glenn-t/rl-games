[project]
name = "rl-games"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "numpy>=2.4.6",
    "open-spiel>=1.6.15",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "ipython>=9.14.0",
    "pytest>=9.0.3",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["games", "agents"]

[project.scripts]
serve = "backend.main:serve"
